<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小罗记账本">
<meta name="theme-color" content="#4f46e5">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>小罗记账本</title>
<style>
/* ============ 基础重置 ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #4f46e5;
  --primary-light: #6366f1;
  --primary-dark: #4338ca;
  --income: #10b981;
  --expense: #ef4444;
  --warn: #f59e0b;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-light: #64748b;
  --text-lighter: #94a3b8;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -2px rgba(0,0,0,.04);
  --radius: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: var(--primary); text-decoration: none; }

/* ============ 顶部状态栏 ============ */
.statusbar {
  height: var(--safe-top);
  background: var(--primary);
}
.app-header {
  background: var(--primary);
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.app-header h1 { font-size: 17px; font-weight: 600; }
.app-header .month-switch { display: flex; align-items: center; gap: 8px; }
.app-header .month-switch button {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.2); color: #fff;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.app-header .month-label { font-size: 14px; min-width: 80px; text-align: center; }

/* ============ 主体 ============ */
#app { min-height: 100vh; display: flex; flex-direction: column; padding-left: 64px; }
.page { display: none; padding: 12px 12px 24px; flex: 1; }
.page.active { display: block; }

/* ============ 概览卡片 ============ */
.overview-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 12px;
  box-shadow: var(--shadow-lg);
}
.overview-card .label { font-size: 13px; opacity: .85; }
.overview-card .amount { font-size: 30px; font-weight: 700; margin: 4px 0 2px; }
.overview-card .amount small { font-size: 16px; font-weight: 500; }
.overview-card .row { display: flex; gap: 20px; margin-top: 12px; }
.overview-card .row > div { flex: 1; }
.overview-card .income-amount { color: #a7f3d0; }
.overview-card .expense-amount { color: #fecaca; }

/* ============ 通用卡片 ============ */
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.card-title a { font-size: 12px; font-weight: 400; }

/* ============ 预算条 ============ */
.budget-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 6px 0; }
.budget-bar .fill { height: 100%; background: var(--income); border-radius: 4px; transition: width .3s; }
.budget-bar .fill.over { background: var(--expense); }
.budget-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); }
.budget-info .over-text { color: var(--expense); font-weight: 600; }

/* ============ 记录列表 ============ */
.record-list { list-style: none; }
.date-group { margin-bottom: 4px; }
.date-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0 6px; font-size: 12px; color: var(--text-light);
  position: relative;
}
.date-header .date-text { font-weight: 600; color: var(--text); white-space: nowrap; }
.date-header .date-summary { color: var(--text-lighter); font-size: 11px; margin-left: auto; white-space: nowrap; }
.date-header .date-line { flex: 1; height: 1px; background: var(--border); }
.record-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.record-item:last-child { border-bottom: none; }
.record-item .cat-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: #f1f5f9; display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.record-item .info { flex: 1; min-width: 0; }
.record-item .info .top { display: flex; align-items: center; gap: 6px; }
.record-item .info .cat-name { font-weight: 500; font-size: 15px; }
.record-item .info .member-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 4px;
  color: #fff; font-weight: 500;
}
.record-item .info .shared-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 4px;
  background: #fef3c7; color: #92400e; font-weight: 500;
}
.record-item .info .note { font-size: 12px; color: var(--text-lighter); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.record-item .info .date { font-size: 11px; color: var(--text-lighter); }
.record-item .amount { font-weight: 600; font-size: 16px; text-align: right; white-space: nowrap; }
.record-item .amount.income { color: var(--income); }
.record-item .amount.expense { color: var(--expense); }
.record-item .amount small { font-size: 11px; font-weight: 400; }

/* ============ 左侧导航栏 ============ */
.tabbar {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: 64px; flex-direction: column;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-right: 1px solid var(--border);
  display: flex; padding-top: calc(12px + var(--safe-top));
  padding-bottom: calc(12px + var(--safe-bottom));
  z-index: 50;
  overflow-y: auto;
}
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button {
  flex: none; width: 100%; padding: 12px 0 8px;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; color: var(--text-lighter); font-size: 9px;
  transition: all .15s; border-left: 3px solid transparent;
}
.tabbar button.active {
  color: var(--primary); background: #eef2ff;
  border-left-color: var(--primary);
}
.tabbar button .icon { font-size: 22px; line-height: 1; }

/* ============ 浮动按钮 ============ */
.fab {
  position: fixed; right: 16px; bottom: 24px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 28px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(79,70,229,.4);
  z-index: 40; transition: transform .15s;
}
.fab:active { transform: scale(.92); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 100; animation: fadeIn .15s;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; width: 100%; max-width: 500px;
  border-radius: 16px 16px 0 0; max-height: 90vh; overflow-y: auto;
  animation: slideUp .2s;
}
.modal-handle { width: 36px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 8px auto; }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px 12px; border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 16px; font-weight: 600; }
.modal-header .close { font-size: 20px; color: var(--text-light); width: 32px; height: 32px; }
.modal-body { padding: 12px 16px; overflow-y: auto; max-height: calc(90vh - 110px); }
/* 分类emoji网格 - 固定高度不撑开页面 */
#catEmojiGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 240px; overflow-y: auto; }
#catEmojiGrid .cat-item { padding: 6px 2px; }
.modal-footer { padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 8px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ============ 表单 ============ */
.form-group { margin-bottom: 8px; }
.form-group label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 8px; background: #f8fafc; outline: none;
  transition: border .15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary); background: #fff;
}
.form-row { display: flex; gap: 8px; align-items: flex-start; }
.form-row .form-group { flex: 1; }
.type-toggle { display: flex; gap: 8px; }
.type-toggle button {
  flex: 1; padding: 7px; border-radius: 8px; font-size: 13px;
  background: #f1f5f9; color: var(--text-light); font-weight: 500;
  transition: all .2s; border: 2px solid transparent;
}
.type-toggle button.active { color: #fff; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.2); transform: scale(1.03); }
.type-toggle button.active.expense { background: var(--expense); border-color: #dc2626; }
.type-toggle button.active.income { background: var(--income); border-color: #059669; }
/* 存款类型按钮 */
.type-toggle button.active.fixed { background: var(--primary); border-color: var(--primary-dark); }
.type-toggle button.active.flexible { background: #06b6d4; border-color: #0891b2; }
.type-toggle button.active.deposit { background: var(--income); border-color: #059669; }
.type-toggle button.active.withdraw { background: var(--expense); border-color: #dc2626; }

/* 分类网格 */
.cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cat-grid .cat-item {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 4px 2px; border-radius: 8px; transition: background .15s;
  cursor: pointer; position: relative;
}
.cat-grid .cat-item .emoji { font-size: 20px; line-height: 1.2; }
.cat-grid .cat-item .name { font-size: 10px; color: var(--text-light); }
.cat-grid .cat-item.active { background: #eef2ff; border: 2px solid var(--primary); transform: scale(1.08); box-shadow: 0 2px 8px rgba(79,70,229,.3); }
.cat-grid .cat-item.active .name { color: var(--primary); font-weight: 700; }
.cat-grid .cat-item.dragging { opacity: .4; }
.cat-grid .cat-item.drag-over { background: #e0e7ff; transform: scale(1.05); }
.cat-grid .cat-add {
  border: 1.5px dashed var(--border); color: var(--text-lighter);
}
.cat-grid .cat-add .emoji { color: var(--text-lighter); }
/* 拖拽删除区 */
.del-zone {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 80px; background: rgba(239,68,68,.95);
  display: none; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; font-weight: 600; gap: 8px;
  z-index: 200; border-radius: 16px 16px 0 0;
}
.del-zone.show { display: flex; }
.del-zone.over { background: rgba(220,38,38,1); transform: scale(1.02); }

/* 对象选择 */
.member-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.member-chip {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 8px; border-radius: 14px;
  background: #f1f5f9; font-size: 12px; transition: all .15s;
  border: 2px solid transparent; position: relative;
}
.member-chip .dot { width: 7px; height: 7px; border-radius: 50%; transition: all .15s; }
.member-chip .check {
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #fff; margin-left: 2px; opacity: 0; transition: opacity .15s;
}
.member-chip.active {
  color: #fff; font-weight: 600; transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(0,0,0,.15);
}
.member-chip.active .dot { background: #fff !important; }
.member-chip.active .check { opacity: 1; }
.member-chip.required-pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(79,70,229,.4); }
  50% { box-shadow: 0 0 0 6px rgba(79,70,229,0); }
}

/* 开关 */
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; background: #cbd5e1; border-radius: 12px; transition: .15s;
}
.switch .slider::before {
  content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .15s;
}
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(20px); }

/* 按钮 */
.btn {
  padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500;
  transition: all .15s; text-align: center;
}
.btn-primary { background: var(--primary); color: #fff; flex: 1; }
.btn-primary:active { background: var(--primary-dark); }
.btn-danger { background: #fee2e2; color: var(--expense); }
.btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn-block { width: 100%; }

/* 空状态 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-lighter); }
.empty-state .emoji { font-size: 48px; margin-bottom: 8px; }
.empty-state .text { font-size: 14px; }

/* SVG icons */
.icon-svg { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-svg svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cat-grid .cat-item .emoji { width: 26px; height: 26px; color: var(--text); }
.record-item .cat-icon .icon-svg { width: 22px; height: 22px; color: var(--text-light); }
.profile-list .list-item .icon .icon-svg { width: 18px; height: 18px; color: var(--primary); }
.tabbar button .icon { width: 22px; height: 22px; }
.fab .icon-svg { width: 28px; height: 28px; color: #fff; }

/* 统计页 */
.stat-tabs { display: flex; gap: 0; margin-bottom: 12px; background: #e2e8f0; border-radius: 8px; padding: 3px; }
.stat-tabs button {
  flex: 1; padding: 6px; font-size: 13px; border-radius: 6px; color: var(--text-light);
}
.stat-tabs button.active { background: #fff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 4px rgba(79,70,229,.25); }
.chart-container { position: relative; height: 260px; margin: 8px 0; }
.summary-row { display: flex; gap: 8px; margin-bottom: 12px; }
.summary-card { flex: 1; background: var(--card); border-radius: var(--radius); padding: 12px; text-align: center; box-shadow: var(--shadow); }
.summary-card .label { font-size: 11px; color: var(--text-light); }
.summary-card .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
.summary-card.income .value { color: var(--income); }
.summary-card.expense .value { color: var(--expense); }
.summary-card.balance .value { color: var(--primary); }

/* 结算页 */
.settle-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.settle-suggestion { background: #eef2ff; border-radius: 8px; padding: 12px; margin-bottom: 10px; text-align: center; }
.settle-suggestion .arrow { font-size: 20px; color: var(--primary); }
.settle-suggestion .amount { font-size: 22px; font-weight: 700; color: var(--primary); }
.settle-list .settle-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.settle-list .settle-item:last-child { border: none; }
.settle-item .info .desc { font-size: 14px; }
.settle-item .info .date { font-size: 11px; color: var(--text-lighter); }
.settle-item .amount { font-weight: 600; }
.settle-item .status { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.settle-item .status.pending { background: #fef3c7; color: #92400e; }
.settle-item .status.settled { background: #d1fae5; color: #065f46; }

/* 我的页 */
.profile-list .list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.profile-list .list-item:last-child { border: none; }
.profile-list .list-item .left { display: flex; align-items: center; gap: 12px; }
.profile-list .list-item .icon { width: 32px; height: 32px; border-radius: 8px; background: #eef2ff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.profile-list .list-item .label { font-size: 14px; }
.profile-list .list-item .arrow { color: var(--text-lighter); font-size: 12px; }

.member-manage-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.member-manage-item .dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; }
.member-manage-item input { flex: 1; }
.color-options { display: flex; gap: 6px; flex-wrap: wrap; }
.color-options .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.color-options .color-dot.active { border-color: #fff; box-shadow: 0 0 0 2px var(--primary); }

.filter-bar { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding: 2px; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar .chip { padding: 4px 10px; border-radius: 14px; background: #fff; font-size: 12px; color: var(--text-light); white-space: nowrap; box-shadow: var(--shadow); }
.filter-bar .chip.active { background: var(--primary); color: #fff; }

.section-header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
.section-header .title { font-size: 14px; font-weight: 600; }
.section-header .total { font-size: 12px; color: var(--text-light); }

/* 排行榜 */
.rank-list { list-style: none; }
.rank-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.rank-item:last-child { border-bottom: none; }
.rank-num { width: 22px; height: 22px; border-radius: 6px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-light); flex-shrink: 0; }
.rank-item:nth-child(1) .rank-num { background: #fef3c7; color: #92400e; }
.rank-item:nth-child(2) .rank-num { background: #e2e8f0; color: #475569; }
.rank-item:nth-child(3) .rank-num { background: #fed7aa; color: #9a3412; }
.rank-bar-wrap { flex: 1; min-width: 0; }
.rank-bar-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
.rank-bar-info .cat-label { display: flex; align-items: center; gap: 6px; }
.rank-bar-info .cat-emoji { font-size: 14px; }
.rank-bar-track { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; }
.rank-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
.rank-amount { font-weight: 600; font-size: 14px; color: var(--expense); white-space: nowrap; }
.rank-pct { font-size: 11px; color: var(--text-lighter); margin-left: 4px; }

/* 周期切换 */
.period-bar { display: flex; gap: 0; margin-bottom: 12px; background: #e2e8f0; border-radius: 8px; padding: 3px; }
.period-bar button { flex: 1; padding: 5px; font-size: 12px; border-radius: 6px; color: var(--text-light); text-align: center; }
.period-bar button.active { background: #fff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 4px rgba(79,70,229,.25); }

/* 存款 */
.savings-overview { display: flex; gap: 8px; margin-bottom: 10px; }
.savings-card { flex: 1; background: #f8fafc; border-radius: var(--radius); padding: 14px; text-align: center; }
.savings-card .savings-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.savings-card .savings-value { font-size: 20px; font-weight: 700; }
.savings-card.fixed .savings-value { color: var(--primary); }
.savings-card.flexible .savings-value { color: var(--income); }
.savings-card.total .savings-value { color: var(--text); }
.savings-history { margin-top: 8px; }
.savings-history-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.savings-history-item:last-child { border: none; }
.savings-history-item .type-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
.savings-history-item .type-tag.fixed { background: #eef2ff; color: var(--primary); }
.savings-history-item .type-tag.flexible { background: #d1fae5; color: #065f46; }
.savings-history-item .amount.deposit { color: var(--income); }
.savings-history-item .amount.withdraw { color: var(--expense); }
</style>
</head>
<body>
<div id="app">
  <!-- 顶部 -->
  <div class="statusbar"></div>
  <div class="app-header">
    <h1>小罗记账本</h1>
    <div class="month-switch">
      <button id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
  </div>

  <!-- ===== 首页 ===== -->
  <div class="page active" id="page-home">
    <div class="overview-card" id="overviewCard"></div>

    <div class="card" id="budgetCard" style="display:none">
      <div class="card-title">
        <span>本月预算</span>
        <a id="setBudgetBtn">设置</a>
      </div>
      <div class="budget-bar"><div class="fill" id="budgetFill"></div></div>
      <div class="budget-info" id="budgetInfo"></div>
    </div>

    <div class="card" id="recentCard">
      <div class="card-title">
        <span>最近记录</span>
        <a id="viewAllRecords">查看全部 ›</a>
      </div>
      <ul class="record-list" id="recentList"></ul>
    </div>
  </div>

  <!-- ===== 统计页 ===== -->
  <div class="page" id="page-stats">
    <div class="stat-tabs" id="statTabs">
      <button class="active" data-tab="overview">概览</button>
      <button data-tab="rank">排行</button>
      <button data-tab="trend">趋势</button>
    </div>
    <!-- 周月年切换 -->
    <div class="period-bar">
      <button class="active" data-period="month">月</button>
      <button data-period="week">周</button>
      <button data-period="year">年</button>
    </div>
    <div id="statContent"></div>
  </div>

  <!-- ===== 存款页 ===== -->
  <div class="page" id="page-save">
    <div class="card" id="savingsCard">
      <div class="card-title"><span>存款总览</span></div>
      <div id="savingsContent"></div>
    </div>
    <button class="btn btn-primary btn-block" id="addSavingsBtn">+ 存入/取出</button>
  </div>

  <!-- ===== 我的页 ===== -->
  <div class="page" id="page-profile">
    <div class="card">
      <div class="card-title"><span>记账对象管理</span><a id="addMemberBtn">+ 添加</a></div>
      <div id="memberManageList"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>分类管理</span></div>
      <div id="categoryManageList"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>数据管理</span></div>
      <div class="profile-list">
        <div class="list-item" id="exportJsonBtn"><div class="left"><div class="icon"><svg class="icon-svg" style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div><div class="label">导出数据 (JSON)</div></div><span class="arrow">›</span></div>

        <div class="list-item" id="importJsonBtn"><div class="left"><div class="icon"><svg class="icon-svg" style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><div class="label">导入数据 (JSON)</div></div><span class="arrow">›</span></div>
        <div class="list-item" id="clearDataBtn"><div class="left"><div class="icon" style="background:#fee2e2"><svg class="icon-svg" style="width:18px;height:18px;color:var(--expense);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></div><div class="label" style="color:var(--expense)">清空所有数据</div></div><span class="arrow">›</span></div>
      </div>
    </div>
    <div class="card" style="text-align:center;color:var(--text-lighter);font-size:12px">
      小罗记账本 v1.0<br>添加到主屏幕即可像 App 使用
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tabbar">
  <button class="active" data-page="home"><span class="icon"><svg class="icon-svg" style="width:22px;height:22px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>首页</button>

  <button data-page="save"><span class="icon"><svg class="icon-svg" style="width:22px;height:22px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>存款</button>

</div>

<button class="fab" id="fabAdd"><svg class="icon-svg" style="width:28px;height:28px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

<!-- ===== 记账模态框 ===== -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="recordModalTitle">记一笔</h2>
      <button class="close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <div class="type-toggle">
          <button class="active expense" data-type="expense">支出</button>
          <button data-type="income">收入</button>
        </div>
      </div>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="recordDate">
      </div>
      <div class="form-group">
        <label>金额 (元)</label>
        <input type="number" id="recordAmount" placeholder="0.00" step="0.01" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>分类</label>
        <div class="cat-grid" id="recordCatGrid"></div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="recordNote" placeholder="选填">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>记账对象</label>
        <div class="member-chips" id="recordMemberChips"></div>

      <button class="btn btn-danger" id="recordDeleteBtn" style="display:none">删除</button>

  </div>
</div>

  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>存款操作</h2>
      <button class="close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>存款类型</label>
        <div class="type-toggle">
          <button class="active fixed" data-savings-type="fixed">固定存款</button>
          <button class="flexible" data-savings-type="flexible">灵活存款</button>
        </div>
      </div>
      <div class="form-group">
        <label>操作</label>
        <div class="type-toggle">
          <button class="active deposit" data-savings-action="deposit">存入</button>
          <button class="withdraw" data-savings-action="withdraw">取出</button>
        </div>
      </div>
      <div class="form-group">
        <label>金额 (元)</label>
        <input type="number" id="savingsAmount" placeholder="0.00" step="0.01" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="savingsDate">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="savingsNote" placeholder="如：7月工资定存">

    <div class="modal-footer">
      <button class="btn btn-danger" id="savingsDeleteBtn" style="display:none">删除</button>
      <button class="btn btn-primary" id="savingsSaveBtn">保存</button>
    </div>
  </div>

/* ============ 工具函数 ============ */
function todayLocal() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtMoney(n) {
  return parseFloat(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtDate(d) {
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}
function ymKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function isSameMonth(date, ref) {
  const a = new Date(date), b = new Date(ref);
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth();
}
function isSameWeek(date, ref) {
  const a = new Date(date), b = new Date(ref);
  // 以周一为周起始
  const getMonday = d => { const t=new Date(d); t.setHours(0,0,0,0); const day=t.getDay()||7; t.setDate(t.getDate()-day+1); return t.getTime(); };
  return getMonday(a) === getMonday(b);
}
function isSameYear(date, ref) {
  return new Date(date).getFullYear() === new Date(ref).getFullYear();
}
function isInPeriod(date, ref, period) {
  if (period === 'week') return isSameWeek(date, ref);
  if (period === 'year') return isSameYear(date, ref);
  return isSameMonth(date, ref);
}
function periodLabel(period, ref) {
  if (period === 'week') {
    const monday = new Date(ref); monday.setHours(0,0,0,0);
    const day = monday.getDay() || 7; monday.setDate(monday.getDate()-day+1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return `${monday.getMonth()+1}/${monday.getDate()} - ${sunday.getMonth()+1}/${sunday.getDate()}`;
  }
  if (period === 'year') return `${ref.getFullYear()}年`;
  return `${ref.getFullYear()}年${ref.getMonth()+1}月`;
}
function getMember(id) { return db.members.find(m=>m.id===id) || {name:'未知', color:'#94a3b8'}; }
function getCat(type, name) {
  const list = db.categories[type] || [];
  return list.find(c=>c.name===name) || {name, icon:'📌'};
}
function catIcon(cat, size=20) {
  if (cat && cat.icon) {
    // emoji 模式
    if (typeof cat.icon === 'string' && cat.icon.length <= 4 && !ICON_KEYS.includes(cat.icon)) {
      return `<span style="font-size:${size}px;line-height:1">${cat.icon}</span>`;
    }
    // 兼容旧 SVG key
    if (ICONS[cat.icon]) return iconSvg(cat.icon, size);
  }
  if (cat && cat.emoji) return `<span style="font-size:${size}px;line-height:1">${cat.emoji}</span>`;
  return '<span style="font-size:20px">📌</span>';
}

    <div class="label">本月结余</div>

  `;

  } else {
    document.getElementById('budgetCard').style.display = 'none';
  }

  // 最近记录（按日期分组）
  const sorted = [...monthRecords].sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id.localeCompare(a.id));

  } else {
    // 按日期分组
    const groups = {};
    recent.forEach(r => {
      const key = r.date.slice(0,10);
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });

      const dayRecords = groups[dateKey];
      const dayIncome = dayRecords.filter(r=>r.type==='income').reduce((s,r)=>s+parseFloat(r.amount),0);
      const dayExpense = dayRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+parseFloat(r.amount),0);
      const dateLabel = formatDateGroup(dateKey);
      const summary = [];
      if (dayIncome > 0) summary.push(`<span style="color:var(--income)">收 ¥${fmtMoney(dayIncome)}</span>`);

        <div class="date-header">
          <span class="date-text">${dateLabel}</span>
          <span class="date-line"></span>
          <span class="date-summary">${summary.join(' · ')}</span>
        </div>
        <ul style="list-style:none;padding:0;margin:0">
          ${dayRecords.map(r => renderRecordItem(r)).join('')}
        </ul>
      </div>`;
    });
    list.innerHTML = html;
  }
}

// 格式化日期分组标题
function formatDateGroup(dateStr) {
  const d = new Date(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  const target = new Date(d); target.setHours(0,0,0,0);
  const weekdays = ['日','一','二','三','四','五','六'];
  const week = `周${weekdays[d.getDay()]}`;
  if (target.getTime() === today.getTime()) return `今天 · ${week}`;
  if (target.getTime() === yesterday.getTime()) return `昨天 · ${week}`;
  return `${d.getMonth()+1}月${d.getDate()}日 · ${week}`;
}

function renderStats() {
  const content = document.getElementById('statContent');

  const income = records.filter(r=>r.type==='income').reduce((s,r)=>s+parseFloat(r.amount),0);
  const expense = records.filter(r=>r.type==='expense').reduce((s,r)=>s+parseFloat(r.amount),0);

  const summary = `
    <div class="summary-row">
      <div class="summary-card income"><div class="label">收入</div><div class="value">¥${fmtMoney(income)}</div></div>

      <div class="summary-card balance"><div class="label">结余</div><div class="value">¥${fmtMoney(income-expense)}</div></div>
    </div>`;

  if (records.length === 0 && state.statTab !== 'trend') {
    content.innerHTML = summary + `<div class="empty-state"><div class="emoji" style="font-size:36px">📊</div><div class="text">${periodLabel(period, state.currentMonth)}暂无数据</div></div>`;
    return;
  }

  if (state.statTab === 'overview') {
    // 概览：分对象统计
    const byMember = {};
    db.members.forEach(m => byMember[m.id] = {income:0, expense:0});
    records.forEach(r => {
      if (byMember[r.memberId]) byMember[r.memberId][r.type] += parseFloat(r.amount);
    });
    let memberRows = db.members.map(m => {
      const d = byMember[m.id];
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:${m.color}"></div>${m.name}</div>
        <div style="font-size:13px"><span style="color:var(--income)">+¥${fmtMoney(d.income)}</span> / <span style="color:var(--expense)">-¥${fmtMoney(d.expense)}</span></div>
      </div>`;
    }).join('');
    content.innerHTML = summary + `<div class="card"><div class="card-title">${periodLabel(period, state.currentMonth)} · 分对象统计</div>${memberRows}</div>`;
  } else if (state.statTab === 'rank') {
    // 排行榜
    const byCat = {};
    const totalExpense = records.filter(r=>r.type==='expense').reduce((s,r)=>s+parseFloat(r.amount),0);
    records.filter(r=>r.type==='expense').forEach(r => {
      byCat[r.category] = (byCat[r.category]||0) + parseFloat(r.amount);
    });
    const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    if (sorted.length === 0) {
      content.innerHTML = summary + `<div class="empty-state"><div class="emoji" style="font-size:36px">📊</div><div class="text">暂无支出数据</div></div>`;
    } else {
      const rankColors = ['#4f46e5','#ec4899','#06b6d4','#f59e0b','#10b981','#8b5cf6','#ef4444','#3b82f6','#94a3b8','#f97316'];
      const maxAmount = sorted[0][1];
      const rankHtml = sorted.map(([cat,amt], idx) => {
        const catObj = getCat('expense', cat);
        const pct = totalExpense > 0 ? (amt/totalExpense*100) : 0;
        const barPct = maxAmount > 0 ? (amt/maxAmount*100) : 0;
        return `<div class="rank-item">
          <div class="rank-num">${idx+1}</div>
          <div class="rank-bar-wrap">
            <div class="rank-bar-info">
              <span class="cat-label"><span class="cat-emoji">${catObj.icon||'📌'}</span>${cat}</span>
              <span>¥${fmtMoney(amt)}<span class="rank-pct">${pct.toFixed(1)}%</span></span>
            </div>
            <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${barPct}%;background:${rankColors[idx%rankColors.length]}"></div></div>
          </div>
        </div>`;
      }).join('');
      content.innerHTML = summary + `<div class="card"><div class="card-title">📊 支出分类排行 · ${periodLabel(period, state.currentMonth)}</div><div class="rank-list">${rankHtml}</div></div>`;
    }
  } else if (state.statTab === 'trend') {
    // 趋势图（固定6月趋势）
    content.innerHTML = summary + `<div class="card"><div class="card-title">近6月收支趋势</div><div class="chart-container"><canvas id="trendChart"></canvas></div></div>`;
    setTimeout(drawTrendChart, 50);
  }
}

function drawPieChart(id, labels, data) {
  const ctx = document.getElementById(id);

  if (state.charts[id]) state.charts[id].destroy();
  const colors = ['#4f46e5','#ec4899','#06b6d4','#f59e0b','#10b981','#8b5cf6','#ef4444','#3b82f6','#94a3b8','#f97316'];
  state.charts[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth:2, borderColor:'#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels:{font:{size:11}, padding:8} } } }
  });
}

function drawTrendChart() {
  const ctx = document.getElementById('trendChart');
  if (!ctx) return;
  if (state.charts.trend) state.charts.trend.destroy();
  const months = [];
  const now = new Date(state.currentMonth);
  for (let i=5; i>=0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d);
  }
  const incomeData = months.map(m => {
    return db.records.filter(r=>r.type==='income' && isSameMonth(r.date, m)).reduce((s,r)=>s+parseFloat(r.amount),0);
  });
  const expenseData = months.map(m => {
    return db.records.filter(r=>r.type==='expense' && isSameMonth(r.date, m)).reduce((s,r)=>s+parseFloat(r.amount),0);
  });
  state.charts.trend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: months.map(m=>`${m.getMonth()+1}月`),
      datasets: [
        { label:'收入', data: incomeData, borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.1)', tension:.3, fill:true },
        { label:'支出', data: expenseData, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.1)', tension:.3, fill:true }
      ]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:8}}} }
  });
}

  // 分类管理（自定义分类可删除）

  };
  const expCats = db.categories.expense.map(c=>renderCatChip(c,'expense')).join('');
  const incCats = db.categories.income.map(c=>renderCatChip(c,'income')).join('');
  cList.innerHTML = `

    <button class="btn btn-outline btn-block" id="addCatBtn" style="margin-top:10px">+ 添加分类</button>
  `;

  cList.querySelectorAll('[data-del-cat-mgmt]').forEach(el=>{

      const id = el.dataset.delCatMgmt;
      const type = el.dataset.delCatType;

      const used = db.records.filter(r=>r.category===cat.name).length;
      const msg = used>0
        ? `分类「${cat.name}」已有 ${used} 条记录使用。\n删除后相关记录的分类会保留名称。确定删除？`
        : `确定删除自定义分类「${cat.name}」？`;
      if (!confirm(msg)) return;
      db.categories[type] = db.categories[type].filter(c=>c.id!==id);
      saveDB(); renderAll();
    });

  // 绑定添加分类按钮
  const addCat = document.getElementById('addCatBtn');

  // render profile-list icons
  document.querySelectorAll('.profile-list .list-item .icon[data-icon]').forEach(span=>{
    if (!span.querySelector('svg')) span.innerHTML = iconSvg(span.dataset.icon, 18).replace(/<span[^>]*>|<\/span>/g,'');
  });

function renderRecordCatGrid(type) {
  const cats = db.categories[type] || [];
  const grid = document.getElementById('recordCatGrid');
  const delZone = document.getElementById('delZone');
  let dragSrc = null;
  // 模式切换按钮
  let toggleBtn = grid.parentElement.querySelector('.cat-mode-toggle');
  if (!toggleBtn) {
    toggleBtn = document.createElement('div');
    toggleBtn.className = 'cat-mode-toggle';
    toggleBtn.style.cssText = 'text-align:center;margin-bottom:6px;font-size:11px;padding:5px 12px;background:#f1f5f9;border-radius:14px;color:var(--text-light);width:fit-content;margin-left:auto;margin-right:auto';
    grid.parentElement.insertBefore(toggleBtn, grid);
  }
  let mode = 'select';
  function setMode(m) {
    mode = m;
    if (mode === 'drag') {
      toggleBtn.textContent = '✓ 完成编辑';
      toggleBtn.style.background = 'var(--primary)';
      toggleBtn.style.color = '#fff';
      delZone.classList.add('show');
      grid.classList.add('drag-mode');
    } else {
      toggleBtn.textContent = '↕ 拖拽排序/删除';
      toggleBtn.style.background = '#f1f5f9';
      toggleBtn.style.color = 'var(--text-light)';
      delZone.classList.remove('show');
      grid.classList.remove('drag-mode');
    }
    if (mode === 'drag') { bindDragEvents(); }
  }
  toggleBtn.onclick = () => setMode(mode==='select'?'drag':'select');
  setMode('select');

  grid.innerHTML = cats.map(c=>`
    <div class="cat-item${state.selectedCat===c.name?' active':''}" data-cat="${c.name}">
      <div class="emoji">${catIcon(c,24)}</div>
      <div class="name">${c.name}</div>
    </div>
  `).join('') + `<div class="cat-item cat-add" id="catAddBtn"><div class="emoji">➕</div><div class="name">更多</div></div>`;

  // 只绑定 click，不绑 drag 事件（避免 iOS Safari 把 touch 当 drag 阻止 click）
  grid.querySelectorAll('.cat-item[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if (mode === 'drag') return;
      grid.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      state.selectedCat = el.dataset.cat;
    });
  });
  // 拖拽事件单独函数，只在进入拖拽模式时调用
  function bindDragEvents() {
    grid.querySelectorAll('.cat-item[data-cat]').forEach(el=>{
      el.draggable = true;
      el.addEventListener('dragstart', (e)=>{
        dragSrc = el;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', el.dataset.cat);
      });
      el.addEventListener('dragover', (e)=>{
        if (!dragSrc) return;
        e.preventDefault();
        if (el !== dragSrc) el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', ()=>{ el.classList.remove('drag-over'); });
      el.addEventListener('drop', (e)=>{
        if (!dragSrc) return;
        e.preventDefault();
        if (el !== dragSrc) {
          const arr = db.categories[type];
          const si = arr.findIndex(c=>c.name===dragSrc.dataset.cat);
          const di = arr.findIndex(c=>c.name===el.dataset.cat);
          if (si>=0 && di>=0) { [arr[si],arr[di]]=[arr[di],arr[si]]; saveDB(); }
        }
        dragSrc.classList.remove('dragging');
        grid.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('drag-over'));
        dragSrc = null;
        renderRecordCatGrid(type);
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
        grid.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('drag-over'));
      });
    });
  }
  // 删除区
  delZone.ondragover = (e)=>{ if(mode==='drag'){ e.preventDefault(); delZone.classList.add('over'); } };
  delZone.ondragleave = ()=>{ delZone.classList.remove('over'); };
  delZone.ondrop = (e)=>{
    if (mode !== 'drag' || !dragSrc) return;
    e.preventDefault();
    delZone.classList.remove('over');
    const catName = dragSrc.dataset.cat;
    const used = db.records.filter(r=>r.category===catName).length;
    const msg = used>0 ? `「${catName}」有 ${used} 条记录，删除后记录保留分类名。确定？` : `删除分类「${catName}」？`;
    if (confirm(msg)) { db.categories[type] = db.categories[type].filter(c=>c.name!==catName); saveDB(); }
    dragSrc.classList.remove('dragging');
    dragSrc = null;
    renderRecordCatGrid(type);
  };
  // 添加分类入口
  const addBtn = document.getElementById('catAddBtn');
  if (addBtn) addBtn.addEventListener('click', ()=>{ openQuickCatModal(type); });
}

function renderRecordMemberChips() {

      <div class="dot" style="background:${m.color}"></div>${m.name}
      <div class="check" ${state.selectedMember===m.id?`style="background:${m.color}"`:''}>✓</div>
    </div>
  `).join('');
  chips.querySelectorAll('.member-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = db.members.find(x=>x.id===el.dataset.member);
      chips.querySelectorAll('.member-chip').forEach(e=>{
        e.classList.remove('active');
        e.style.background = '';
        e.style.borderColor = '';
        const check = e.querySelector('.check');
        if (check) check.style.background = '';
      });
      el.classList.add('active');
      if (m) {
        el.style.background = m.color;
        el.style.borderColor = m.color;
        const check = el.querySelector('.check');
        if (check) check.style.background = m.color;
      }
      state.selectedMember = el.dataset.member;
    });
  });
}

/* ============ 保存操作 ============ */
function saveRecord() {
  const amount = parseFloat(document.getElementById('recordAmount').value);
  if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
  if (!state.selectedCat) { alert('请选择分类'); return; }
  if (!state.selectedMember) {
    const chips = document.getElementById('recordMemberChips');
    chips.querySelectorAll('.member-chip').forEach(c=>{
      c.classList.add('required-pulse');
      setTimeout(()=>c.classList.remove('required-pulse'), 2000);
    });
    alert('请选择记账对象');
    return;
  }

  const date = document.getElementById('recordDate').value;
  const note = document.getElementById('recordNote').value.trim();
  const isShared = false; // 共同支出已移除

  if (state.editingRecordId) {
    const r = db.records.find(x=>x.id===state.editingRecordId);
    if (r) {
      r.type = state.recordType;
      r.amount = amount;
      r.category = state.selectedCat;
      r.memberId = state.selectedMember;
      r.date = date;
      r.note = note;
    }
  } else {
    db.records.push({
      id: uid('r'),
      type: state.recordType,
      amount,
      category: state.selectedCat,
      memberId: state.selectedMember,
      date,
      note
    });
  }
  saveDB();
  closeModal('recordModal');
  renderAll();
}

function saveSavings() {
  const type = document.querySelector('#savingsModal [data-savings-type].active')?.dataset.savingsType || 'fixed';
  const action = document.querySelector('#savingsModal [data-savings-action].active')?.dataset.savingsAction || 'deposit';
  const amount = parseFloat(document.getElementById('savingsAmount').value);
  const date = document.getElementById('savingsDate').value;
  const note = document.getElementById('savingsNote').value.trim();

  if (!amount || amount <= 0) { alert('请输入有效金额'); return; }

  if (state.editingSavingsId) {
    const s = db.savings.find(x=>x.id===state.editingSavingsId);
    if (s) { s.type=type; s.action=action; s.amount=amount; s.date=date; s.note=note; }
  } else {
    db.savings.push({ id: uid('sv'), type, action, amount, date, note });
  }
  saveDB();
  closeModal('savingsModal');
  renderAll();
}

function saveMember() {
  const name = document.getElementById('memberName').value.trim();
  if (!name) { alert('请输入名称'); return; }

  if (state.editingMemberId) {
    const m = db.members.find(x=>x.id===state.editingMemberId);
    if (m) { m.name = name; m.color = state.selectedMemberColor; }
  } else {
    db.members.push({ id: uid('m'), name, color: state.selectedMemberColor });
  }
  saveDB();
  closeModal('memberModal');
  renderAll();
}

function deleteMember(id) {
  const records = db.records.filter(r=>r.memberId===id);
  if (records.length > 0) {
    if (!confirm(`该对象有 ${records.length} 条记录，删除后这些记录将变为"未知"对象。确定删除？`)) return;
    records.forEach(r=>r.memberId='unknown');
  }
  db.members = db.members.filter(m=>m.id!==id);
  saveDB();
  closeModal('memberModal');
  renderAll();
}

function saveBudget() {
  const total = parseFloat(document.getElementById('budgetTotal').value) || 0;
  const byMember = {};
  document.querySelectorAll('[data-member-budget]').forEach(input=>{
    const v = parseFloat(input.value);
    if (v > 0) byMember[input.dataset.memberBudget] = v;
  });
  db.budgets.monthly = { total, byMember };
  saveDB();
  closeModal('budgetModal');
  renderAll();
}

function saveCat() {
  const name = document.getElementById('catName').value.trim();
  if (!name) { alert('请输入分类名称'); return; }
  const list = db.categories[state.catType];
  if (list.find(c=>c.name===name)) { alert('该分类已存在'); return; }
  list.push({ id: uid('uc'), name, icon: state.selectedEmoji });
  saveDB();
  closeModal('catModal');
  // 如果是从记账模态框进入，刷新记账网格并选中新分类
  if (state.catReturnTo === 'record') {
    state.selectedCat = name;
    renderRecordCatGrid(state.catType);
    // 重新打开记账模态框（保持数据）
    openModal('recordModal');
  } else {
    renderAll();
  }
}

/* ============ 数据导入导出 ============ */
function exportJSON() {
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  downloadBlob(blob, `记账备份_${new Date().toISOString().slice(0,10)}.json`);
}
function exportCSV() {
  const rows = [['日期','类型','金额','分类','对象','共同','备注']];
  db.records.forEach(r=>{
    const m = getMember(r.memberId);
    rows.push([r.date, r.type==='income'?'收入':'支出', r.amount, r.category, m.name, r.isShared?'是':'', r.note||'']);
  });
  const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  downloadBlob(blob, `记账记录_${new Date().toISOString().slice(0,10)}.csv`);
}
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.records || !Array.isArray(data.records)) { alert('无效的备份文件'); return; }
      if (confirm('导入将覆盖当前所有数据，确定继续？')) {
        db = {
          members: data.members || db.members,
          categories: data.categories || db.categories,
          records: data.records,
          savings: data.savings || data.settlements || [],
          budgets: data.budgets || {monthly:{total:0,byMember:{}}}
        };
        saveDB();
        renderAll();
        alert('导入成功');
      }
    } catch(err) { alert('文件解析失败: '+err.message); }
  };
  reader.readAsText(file);
}
function clearAllData() {
  if (!confirm('确定清空所有数据？此操作不可恢复！')) return;
  if (!confirm('再次确认：所有记账记录、对象、分类都将被删除！')) return;
  localStorage.removeItem(STORE_KEY);
  db = loadDB();
  renderAll();
}

/* ============ 页面切换 ============ */
function switchPage(name) {
  state.currentPage = name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  // render tabbar icons once (lazy)
  document.querySelectorAll('.tabbar button .icon[data-icon]').forEach(span=>{
    if (!span.querySelector('svg')) span.innerHTML = iconSvg(span.dataset.icon, 22).replace(/<span[^>]*>|<\/span>/g,'');
  });
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.page===name);
  });
  document.getElementById('fabAdd').style.display = (name==='save'||name==='profile') ? 'none' : '';
  if (name==='stats') renderStats();
  if (name==='save') renderSavings();
  window.scrollTo(0,0);
}

/* ============ 事件绑定 ============ */
function bindEvents() {
  // 底部导航
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.addEventListener('click', ()=>switchPage(b.dataset.page));
  });

  // 月份切换
  document.getElementById('prevMonth').addEventListener('click', ()=>{
    state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth()-1, 1);
    renderAll();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth()+1, 1);
    renderAll();
  });

  // 浮动按钮
  document.getElementById('fabAdd').addEventListener('click', ()=>openRecordModal());

  // 模态框关闭
  document.querySelectorAll('[data-close-modal]').forEach(b=>{
    b.addEventListener('click', ()=>closeAllModals());
  });
  document.querySelectorAll('.modal-overlay').forEach(m=>{
    m.addEventListener('click', (e)=>{ if(e.target===m) closeAllModals(); });
  });

  // 记录模态框
  document.querySelectorAll('#recordModal .type-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#recordModal .type-toggle button').forEach(x=>{
        x.classList.remove('active','expense','income');
      });
      b.classList.add('active', b.dataset.type);
      state.recordType = b.dataset.type;
      renderRecordCatGrid(state.recordType);
      state.selectedCat = null;
    });
  });
  document.getElementById('recordSaveBtn').addEventListener('click', ()=>{ saveRecord(); });
  document.getElementById('recordDeleteBtn').addEventListener('click', ()=>{
    if (state.editingRecordId && confirm('删除这条记录？')) {
      db.records = db.records.filter(r=>r.id!==state.editingRecordId);
      saveDB(); closeModal('recordModal'); renderAll();
    }
  });

  // 记录编辑
  document.getElementById('recentList').addEventListener('click', (e)=>{
    const item = e.target.closest('[data-edit-record]');
    if (item) openRecordModal(item.dataset.id);
  });

  // 存款模态框
  document.getElementById('addSavingsBtn').addEventListener('click', ()=>openSavingsModal());
  document.getElementById('savingsSaveBtn').addEventListener('click', saveSavings);
  document.getElementById('savingsDeleteBtn').addEventListener('click', ()=>{
    if (state.editingSavingsId && confirm('删除这条存款记录？')) {
      db.savings = db.savings.filter(s=>s.id!==state.editingSavingsId);
      saveDB(); closeModal('savingsModal'); renderAll();
    }
  });
  // 存款记录列表点击编辑
  document.getElementById('savingsContent').addEventListener('click', (e)=>{
    const item = e.target.closest('[data-edit-savings]');
    if (item) openSavingsModal(item.dataset.id);
  });

  // 存款模态框类型/操作切换
  document.querySelectorAll('#savingsModal [data-savings-type]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#savingsModal [data-savings-type]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.querySelectorAll('#savingsModal [data-savings-action]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#savingsModal [data-savings-action]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  // 对象管理
  document.getElementById('addMemberBtn').addEventListener('click', ()=>openMemberModal());
  document.getElementById('memberSaveBtn').addEventListener('click', saveMember);
  document.getElementById('memberDeleteBtn').addEventListener('click', ()=>{
    if (state.editingMemberId) deleteMember(state.editingMemberId);
  });
  document.getElementById('memberManageList').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-edit-member-id]');
    if (btn) openMemberModal(btn.dataset.editMemberId);
  });

  // 分类
  document.querySelectorAll('#catModal .type-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#catModal .type-toggle button').forEach(x=>{
        x.classList.remove('active','expense','income');
      });
      b.classList.add('active', b.dataset.catType);
      state.catType = b.dataset.catType;
    });
  });
  document.getElementById('catSaveBtn').addEventListener('click', saveCat);

  // 预算
  document.getElementById('setBudgetBtn').addEventListener('click', openBudgetModal);
  document.getElementById('budgetSaveBtn').addEventListener('click', saveBudget);

  // 统计 tab
  document.querySelectorAll('#statTabs button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#statTabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.statTab = b.dataset.tab;
      renderStats();
    });
  });

  // 统计周期切换（周/月/年）
  document.querySelectorAll('.period-bar button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.period-bar button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.statPeriod = b.dataset.period;
      renderStats();
    });
  });

  // 查看全部
  document.getElementById('viewAllRecords').addEventListener('click', ()=>{
    switchPage('home');
    document.getElementById('recentList').scrollIntoView();
  });

  // 数据管理
  document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
  document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);
  document.getElementById('importJsonBtn').addEventListener('click', ()=>{
    document.getElementById('importFileInput').click();
  });
  document.getElementById('importFileInput').addEventListener('change', (e)=>{
    if (e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('clearDataBtn').addEventListener('click', clearAllData);
}

/* ============ 初始化 ============ */
function init() {
  bindEvents();
  renderAll();

  // Service Worker - 强制更新，清理旧缓存
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      if (reg.waiting) { reg.waiting.postMessage('SKIP_WAITING'); }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (nw) {
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              nw.postMessage('SKIP_WAITING');
            }
          });
        }
      });
    }).catch(err => console.warn('SW err:', err));

    // 强制清理所有旧缓存
    if (window.caches) {
      caches.keys().then(keys => {
        keys.forEach(k => {
          if (k !== 'xiaoluo-accounting-v8') {
            console.log('清理旧缓存:', k);
            caches.delete(k);
          }
        });
      });
    }

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      console.log('SW 已更新，刷新页面');
      window.location.reload();
    });
  }

  // 强制版本检查：每次打开都请求最新 HTML，发现更新就自动刷新
  (function checkUpdate() {
    const VER_KEY = '__app_ver';
    const cur = localStorage.getItem(VER_KEY);
    fetch('index.html', { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const m = html.match(/CACHE_NAME.*?v(\d+)/);
        const newVer = m ? m[1] : null;
        if (newVer && cur && cur !== newVer) {
          localStorage.setItem(VER_KEY, newVer);
          window.location.reload();
        } else if (newVer) {
          localStorage.setItem(VER_KEY, newVer);
        }
      })
      .catch(() => {});
  })();
}
init();
</script>
